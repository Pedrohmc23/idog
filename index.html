<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Idog</title>
</head>
<body>
  <div id="app">
    <header>
      <h1>🐾 Idog</h1>
    </header>
    <main>
      <form id="dogForm">
        <input type="text" placeholder="Nome do cão" name="name" required />
        <input type="text" placeholder="Raça" name="breed" required />
        <input type="text" placeholder="Nome do dono" name="owner" required />
        <input type="date" placeholder="Data de nascimento" name="birth" required />
        <input type="number" placeholder="Peso (kg)" name="weight" step="0.1" required />
        <textarea placeholder="Vacinas e datas (ex: V10 - 01/01/2025)" name="vaccines"></textarea>
        <textarea placeholder="Remédios e datas (ex: Vermífugo - 01/01/2025)" name="medications"></textarea>
        <button type="submit">Salvar</button>
      </form>
      <button onclick="generatePDF()">📄 Gerar PDF</button>
      <button onclick="getRecommendation()">🤖 Recomendações IA</button>
      <div id="output"></div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
