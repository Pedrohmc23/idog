<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Idog</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registrado!'));
    }
  </script>
</head>
<body>
  <div class="app-header">Idog</div>
  <div class="form-container">
    <form id="dogForm">
      <div class="form-group"><label>Nome</label><input type="text" id="nome" required /></div>
      <div class="form-group"><label>Raça</label><input type="text" id="raca" value="Husky Siberiano" required /></div>
      <div class="form-group"><label>Data de Nascimento</label><input type="date" id="nascimento" required /></div>
      <div class="form-group"><label>Peso Atual (kg)</label><input type="number" id="peso" step="0.1" required /></div>
      <div class="form-group"><label>Dono</label><input type="text" id="dono" required /></div>
      <div class="section-title">Vacinas</div>
      <div class="form-group"><textarea id="vacinas" rows="3" placeholder="Ex: V8 - 01/03/2025"></textarea></div>
      <div class="form-group"><label>Próxima Vacina</label><input type="date" id="proximaVacina" /></div>
      <div class="section-title">Remédios</div>
      <div class="form-group"><textarea id="remedios" rows="3" placeholder="Ex: Vermífugo - 01/03/2025 (Mensal)"></textarea></div>
      <div class="form-group"><label>Próximo Remédio</label><input type="date" id="proximoRemedio" /></div>
      <button type="submit" class="btn-save">Salvar</button>
    </form>
    <button onclick="gerarPDF()" class="btn-action">Exportar PDF</button>
    <button onclick="gerarRecomendacoes()" class="btn-action">Recomendações</button>
    <div id="output" class="output-box"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
